<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Properties — The Real Estate of Vadodara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
.bar{position:sticky;top:0;z-index:30;background:rgba(243,239,231,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:76px var(--g) 18px;display:flex;flex-wrap:wrap;gap:14px 28px;align-items:end;justify-content:space-between}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:9px 18px;font-size:13px;transition:all .3s}
.chip.on,.chip:hover{background:var(--ink);color:var(--bone);border-color:var(--ink)}
.bar .field{min-width:150px}.bar .field select{padding:8px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:56px 28px;padding:60px var(--g) 140px}
@media(max-width:1000px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:620px){.grid{grid-template-columns:1fr}}
.count{font:300 22px Fraunces,serif}
.empty{grid-column:1/-1;text-align:center;padding:80px 0}
.empty h3{font:300 44px Fraunces,serif}
</style>
</head>
<body>
<section class="phero">
 <div class="eyebrow">Properties · Vadodara</div><br>
 <h1 class="serif" id="h1">Every home,<br><em class="gold">verified.</em></h1>
 <div class="row"><p>Apartments, villas, penthouses, offices and plots across West and Central Vadodara — each one visited and title-checked by us.</p><span class="count"><span id="cnt">0</span> properties</span></div>
</section>

<div class="bar">
 <div class="chips" id="chips"></div>
 <div style="display:flex;gap:24px;flex-wrap:wrap">
  <div class="field"><label>Area</label><select id="fArea"><option value="">Anywhere</option></select></div>
  <div class="field"><label>Budget</label><select id="fMax"><option value="">Any</option><option value="8000000">Under ₹80 L</option><option value="15000000">Under ₹1.5 Cr</option><option value="30000000">Under ₹3 Cr</option></select></div>
  <div class="field"><label>Sort</label><select id="fSort"><option value="">Featured</option><option value="lo">Price: low → high</option><option value="hi">Price: high → low</option><option value="sz">Largest first</option></select></div>
 </div>
</div>

<div class="grid" id="grid"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
riseLines('#h1',PAGE_IN,'-=.4');
const q=new URLSearchParams(location.search);let type=q.get('type')||'';
const types=['','Apartment','Villa','Penthouse','Commercial','Plot'];
chips.innerHTML=types.map(t=>`<button class="chip ${t===type?'on':''}" data-t="${t}">${t||'All'}</button>`).join('');
[...new Set(PROPS.map(p=>p.area))].forEach(a=>fArea.add(new Option(a,a)));
fArea.value=q.get('area')||'';fMax.value=q.get('max')||'';

function render(first){
  let list=PROPS.filter(p=>(!type||p.type===type)&&(!fArea.value||p.area===fArea.value)&&(!fMax.value||p.price<=+fMax.value));
  const s=fSort.value;if(s)list=[...list].sort((a,b)=>s==='lo'?a.price-b.price:s==='hi'?b.price-a.price:b.sqft-a.sqft);
  const draw=()=>{grid.innerHTML=list.length?list.map(cardHTML).join(''):`<div class="empty"><h3>Nothing here — <em class="gold">yet.</em></h3><p style="color:var(--muted);margin:14px 0 26px">New stock reaches us before it reaches the portals.</p><a class="btn" href="contact.html">Tell us what you need →</a></div>`;
    gsap.from('#grid .pcard',{y:80,opacity:0,stagger:.08,duration:1.1,ease:'expo.out'});
    gsap.from('#grid .pcard .ph',{clipPath:'inset(100% 0 0 0)',stagger:.08,duration:1.3,ease:'expo.inOut'});
    gsap.to({v:+cnt.textContent},{v:list.length,duration:.8,onUpdate(){cnt.textContent=Math.round(this.targets()[0].v)}});
    ScrollTrigger.refresh()};
  first?draw():gsap.to('#grid .pcard,.empty',{y:-30,opacity:0,stagger:.03,duration:.35,onComplete:draw});
  if(!grid.children.length)draw();
}
chips.onclick=e=>{const b=e.target.closest('.chip');if(!b)return;type=b.dataset.t;chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));render()};
[fArea,fMax,fSort].forEach(s=>s.onchange=()=>render());
PAGE_IN.add(()=>render(true),'-=.6');
</script>
</body>
</html>
